# Votes collectifs (phase « conflits »). Le premier vote dont la condition est remplie est joué.
# Mettre l'option « statu quo » en premier : elle gagne en cas d'égalité.
- id: loi_voitures_thermiques
  eras: [2026, 2030]
  title: Voitures thermiques
  text: Faut-il interdire la vente de voitures neuves essence et diesel à partir de 2035 ?
  options:
    - id: repousser
      label: Repousser l'interdiction
      effects: { emissions: 2, gdp: 1, approval: 1 }
    - id: interdire
      label: Interdire en 2035
      effects: { emissions: -4, gdp: -1, employment: -1 }

- id: loi_taxe_carbone
  eras: [2035, 2040, 2045, 2050]
  when: { indicator: awareness, gt: 30 }
  title: Taxe carbone
  text: Le parlement débat d'une taxe sur les émissions de CO2.
  options:
    - id: contre
      label: Rejeter la taxe
      effects: { gdp: 1 }
    - id: pour
      label: Adopter la taxe
      effects: { emissions: -5, gdp: -1, approval: -1 }

- id: loi_littoral
  eras: [2060, 2070, 2080, 2090]
  title: Montée des eaux
  text: La mer grignote les côtes. Que faire des villes du littoral ?
  options:
    - id: digues
      label: Construire des digues géantes
      effects: { emissions: 2, gdp: -1, employment: 2 }
    - id: relocaliser
      label: Déplacer les habitants vers l'intérieur
      effects: { wellbeing: -2, approval: -2, deforestation: 1 }
