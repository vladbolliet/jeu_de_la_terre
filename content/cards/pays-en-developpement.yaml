# Cartes propres aux pays en développement (et parfois émergents) : énergie, villes qui grandissent,
# entrepreneuriat, mousson, droit au développement. Les cartes sans `regions` sortent partout.
# Ton : des personnes qui font des choix, jamais des victimes à plaindre. Voir docs/CONTENU.md.

# --- Citoyen·nes ---
- id: citoyen_cuisine
  roles: [citoyen]
  regions: [developpement]
  title: Ta nouvelle cuisine
  text: Tu équipes la cuisine de ton nouvel appartement. Au marché, le charbon de bois reste le moins cher, mais la ville développe le gaz et l'électricité.
  options:
    - id: charbon
      label: Un fourneau au charbon de bois, le moins cher
      outcome: Économique au quotidien. Ce charbon vient de forêts de plus en plus lointaines.
      effects: { deforestation: 3, wellbeing: -1 }
      score: 4
    - id: gaz
      label: Une gazinière avec bouteilles
      outcome: Plus propre et plus rapide. La bouteille pèse sur le budget du mois.
      effects: { emissions: 1, deforestation: -1, wellbeing: 2 }
      score: 2
    - id: induction
      label: Une plaque électrique branchée sur le solaire de l'immeuble
      outcome: Un investissement au départ. Ensuite, tu cuisines presque gratuitement.
      effects: { emissions: -1, deforestation: -1, wellbeing: 1 }
      score: 2

- id: citoyen_electricite
  roles: [citoyen]
  regions: [developpement]
  eras: [2026, 2030, 2035, 2040, 2045]
  title: Ton atelier
  text: Ton atelier de couture marche bien et tu as deux employées. Mais les coupures de courant arrêtent les machines plusieurs heures par semaine.
  options:
    - id: groupe
      label: Acheter un groupe électrogène au diesel
      outcome: Plus aucune coupure. Le diesel coûte cher et le bruit gêne la rue.
      effects: { emissions: 3, employment: 1 }
      score: 4
    - id: solaire
      label: Des panneaux et une batterie, payés par mensualités sur ton téléphone
      outcome: Deux ans de mensualités. Ensuite, ton électricité est gratuite.
      effects: { emissions: -1, employment: 1 }
      score: 2
    - id: rue
      label: Une installation solaire partagée avec les commerces de la rue
      outcome: Il a fallu convaincre tout le monde. Maintenant, toute la rue tourne au soleil.
      effects: { emissions: -2, wellbeing: 1 }
      score: 2

- id: citoyen_moto
  roles: [citoyen]
  regions: [developpement]
  eras: [2026, 2030, 2035, 2040, 2045, 2050]
  title: Ton activité de livraison
  text: Tu lances ton activité de livraison avec une appli. La demande explose en ville, il te faut un véhicule.
  options:
    - id: essence
      label: Une moto à essence d'occasion
      outcome: Pas chère et facile à réparer. L'essence mange une partie de tes gains.
      effects: { emissions: 2, employment: 1 }
      score: 4
    - id: electrique
      label: Une moto électrique à batterie échangeable
      outcome: Plus chère à l'achat. Tu changes de batterie en deux minutes à la station du quartier.
      effects: { emissions: -1, employment: 1 }
      score: 2
    - id: cargo
      label: Un vélo cargo électrique pour le centre-ville
      outcome: Moins de distance, mais plus de livraisons dans les rues embouteillées.
      effects: { emissions: -1 }
      score: 1

- id: citoyen_exode
  roles: [citoyen]
  regions: [developpement, emergent]
  eras: [2040, 2045, 2050, 2060, 2070, 2080, 2090]
  title: Changer de région ?
  text: Les sécheresses se répètent dans ta région et les récoltes de ta famille baissent. Une entreprise de la capitale te propose un poste.
  options:
    - id: capitale
      label: Partir travailler dans la capitale
      outcome: Un bon poste, mais les loyers sont chers et ton quartier est en zone inondable.
      effects: { employment: 1, wellbeing: -1 }
      score: 3
    - id: etranger
      label: Partir travailler quelques années à l'étranger
      outcome: Tu gagnes bien ta vie et tu aides ta famille. Elle te manque.
      effects: { gdp: 1, wellbeing: -1 }
      score: 3
    - id: rester
      label: Rester et monter une coopérative d'irrigation au goutte-à-goutte
      outcome: Deux saisons de travail avant les résultats. Puis la région reprend des couleurs.
      effects: { wellbeing: 1, deforestation: -1 }
      score: 1

- id: citoyen_cyclone
  roles: [citoyen]
  regions: [developpement, emergent]
  eras: [2050, 2060, 2070, 2080, 2090]
  title: Après le cyclone
  text: Un cyclone a endommagé ta maison. L'État ouvre un programme d'aide à la reconstruction.
  options:
    - id: pareil
      label: Réparer vite, comme avant
      outcome: Ta maison est réparée en trois semaines. Au même endroit que la dernière fois.
      effects: { wellbeing: -1 }
      score: 3
    - id: normes
      label: Reconstruire aux normes anticycloniques avec l'aide publique
      outcome: Six mois de travaux. Puis une maison surélevée qui résiste.
      effects: { wellbeing: 2 }
      score: 2
    - id: partir
      label: T'installer dans une autre ville, loin de la côte
      effects: { employment: -1 }
      score: 2

# --- Agriculteur·rices ---
- id: agriculteur_brulis
  roles: [agriculteur]
  regions: [developpement, emergent]
  title: La lisière de la forêt
  text: Ta terre s'épuise. Juste à côté commence la forêt tropicale. Un acheteur de cacao et d'huile de palme paie bien.
  options:
    - id: bruler
      label: Brûler une parcelle de forêt pour planter
      outcome: La terre neuve est fertile, pour quelques années. La fumée se voit de loin.
      effects: { deforestation: 4, emissions: 1 }
      score: 4
    - id: vendre
      label: Vendre ta parcelle à une plantation de palmiers
      outcome: Tu touches de l'argent tout de suite. Les bulldozers arrivent le mois suivant.
      effects: { deforestation: 3, gdp: 1 }
      score: 3
    - id: agroforesterie
      label: Planter le cacao sous les grands arbres
      outcome: Rendements plus faibles, mais la forêt reste debout et ta terre ne s'épuise plus.
      effects: { deforestation: -2 }
      score: 1

- id: agriculteur_semences
  roles: [agriculteur]
  regions: [developpement]
  eras: [2026, 2030, 2035, 2040, 2045, 2050]
  title: Les semences
  text: Un vendeur propose des semences hybrides à haut rendement, avec engrais et pesticides, payables à la récolte.
  options:
    - id: hybrides
      label: Prendre le paquet complet à crédit
      outcome: Belle récolte si la pluie vient. Sinon, tu dois quand même rembourser.
      effects: { emissions: 2, gdp: 1 }
      score: 4
    - id: paysannes
      label: Garder tes semences paysannes, adaptées au sol
      outcome: Moins de rendement, mais rien à rembourser et elles résistent à la sécheresse.
      effects: { wellbeing: 1 }
      score: 2
    - id: groupement
      label: Acheter en groupement avec d'autres familles et partager les risques
      outcome: Réunions, cahiers de comptes, disputes. Mais personne ne perd tout.
      effects: { emissions: 1, employment: 1 }
      score: 3

- id: agriculteur_mousson
  roles: [agriculteur]
  regions: [developpement]
  eras: [2045, 2050, 2060, 2070, 2080, 2090]
  title: La mousson est en retard
  text: Les pluies devaient arriver il y a un mois. Tes plants de riz jaunissent.
  options:
    - id: pomper
      label: Pomper la nappe avec une motopompe au diesel
      outcome: Ton riz est sauvé. La nappe baisse d'un mètre par an.
      effects: { emissions: 2, wellbeing: -1 }
      score: 4
    - id: millet
      label: Passer au millet, qui a besoin de moins d'eau
      outcome: Il se vend moins cher que le riz, mais il pousse.
      effects: { wellbeing: 1 }
      score: 2
    - id: saison_ville
      label: Laisser la ferme et partir travailler en ville pour la saison
      outcome: Tu gagnes un bon salaire en ville. La ferme reste en friche cette saison.
      effects: { employment: 1, wellbeing: -1 }
      score: 3

# --- Politiques ---
- id: politique_electrifier
  roles: [politique]
  regions: [developpement, emergent]
  eras: [2026, 2030, 2035, 2040]
  title: Électrifier le pays
  text: La demande d'électricité de ton pays double tous les dix ans. Un consortium international propose une grande centrale à charbon, livrée clé en main. Après tout, les pays riches se sont développés au charbon.
  options:
    - id: charbon
      label: Accepter la centrale à charbon
      outcome: La production double en 4 ans. Une centrale qui tournera 40 ans.
      effects: { emissions: 5, gdp: 3, wellbeing: 2, approval: 2 }
      score: 5
    - id: solaire
      label: Du solaire et des mini-réseaux, si l'aide internationale suit
      outcome: Les financements internationaux arrivent lentement. Le réseau grandit région par région.
      effects: { emissions: -2, wellbeing: 1, approval: -1 }
      score: 2
    - id: mix
      label: Une centrale au gaz plus petite et du solaire
      outcome: Un compromis. Tu restes dépendant des importations de gaz.
      effects: { emissions: 2, gdp: 1, wellbeing: 1 }
      score: 3

- id: politique_dette
  roles: [politique]
  regions: [developpement]
  eras: [2030, 2035, 2040, 2045, 2050, 2060, 2070]
  title: La dette
  text: Un tiers du budget de ton pays sert à rembourser la dette. Des groupes internationaux proposent d'exploiter le pétrole et la forêt.
  options:
    - id: exploiter
      label: Vendre des concessions de pétrole et de bois
      outcome: La dette baisse. Les camions de grumes défilent sur la route nationale.
      effects: { emissions: 3, deforestation: 3, gdp: 2 }
      score: 4
    - id: echange
      label: "Négocier « dette contre nature » : une partie de la dette effacée si la forêt est protégée"
      outcome: Des années de négociations avec les créanciers. La forêt reste debout.
      effects: { deforestation: -3, gdp: -1 }
      score: 2
    - id: annulation
      label: Réclamer l'annulation de la dette avec d'autres pays
      outcome: Ton discours fait le tour du monde. Les créanciers ne bougent pas, pour l'instant.
      effects: { awareness: 2, approval: 2 }
      score: 3
